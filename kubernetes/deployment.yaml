apiVersion: apps/v1
kind: Deployment
metadata:
  name: blogpost-deployment
  labels:
    app: blogpost
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blogpost
  template:
    metadata:
      labels:
        app: blogpost
    spec:
      containers:
      - name: blogpost-app
        image: blogpost-app:1.0
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        env:
        - name: DEBUG
          valueFrom:
            secretKeyRef:
              name: django-secret
              key: DEBUG
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: django-secret
              key: SECRET_KEY
        - name: ALLOWED_HOSTS
          valueFrom:
            secretKeyRef:
              name: django-secret
              key: ALLOWED_HOSTS
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: django-secret
              key: DATABASE_URL
        envFrom:
        - configMapRef:
            name: blogpost-config
        - secretRef:
            name: blogpost-secret
        volumeMounts:
        - name: blogpost-data
          mountPath: /app/data
        - name: blogpost-media
          mountPath: /app/media
        livenessProbe:
          httpGet:
            path: /admin/login/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /admin/login/
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
      volumes:
      - name: blogpost-data
        persistentVolumeClaim:
          claimName: blogpost-pvc-data
      - name: blogpost-media
        persistentVolumeClaim:
          claimName: blogpost-pvc-media
